<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Mobile Shooter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="hud">
        <div class="hud-item">
          <span class="label">Pontuação</span>
          <strong id="score">0</strong>
        </div>
        <div class="hud-item">
          <span class="label">Vida</span>
          <strong id="health">100</strong>
        </div>
        <div class="hud-item">
          <span class="label">Melhor</span>
          <strong id="best">0</strong>
        </div>
      </header>

      <canvas id="gameCanvas" width="420" height="760" aria-label="Jogo de tiro"></canvas>

      <div class="overlay" id="overlay">
        <div class="panel">
          <h1>Mobile Shooter</h1>
          <p id="overlayText">Toque para iniciar</p>
          <button id="startBtn">Jogar</button>
        </div>
      </div>

      <div class="controls">
        <button id="leftBtn" aria-label="Mover para a esquerda">◀</button>
        <button id="shootBtn" aria-label="Atirar">Fogo</button>
        <button id="rightBtn" aria-label="Mover para a direita">▶</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
